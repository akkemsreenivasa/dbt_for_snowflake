version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Cleaned order data"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Cleaned product data"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

